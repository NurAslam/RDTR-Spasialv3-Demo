version: '3.8'

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: rdtr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rdtr-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount output folder untuk hardcode data dinamis
      - ./packages/output:/app/output:ro
    environment:
      - OUTPUT_DIR=/app/output
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rdtr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
