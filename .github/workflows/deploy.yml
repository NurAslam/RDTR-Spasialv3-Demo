name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Enable manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (optional - remove if not using registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Frontend Image
        run: |
          docker build -t rdtr-frontend:${{ github.sha }} ./apps/frontend
          docker tag rdtr-frontend:${{ github.sha }} rdtr-frontend:latest

      - name: Build Backend Image
        run: |
          docker build -t rdtr-backend:${{ github.sha }} ./apps/backend
          docker tag rdtr-backend:${{ github.sha }} rdtr-backend:latest

      - name: Save images to tar
        run: |
          docker save rdtr-frontend:latest rdtr-backend:latest | gzip > images.tar.gz

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "images.tar.gz,docker-compose.prod.yml,nginx.conf"
          target: "/var/www/rdtr-spasial-app"
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/rdtr-spasial-app
            
            # Load images
            gunzip < images.tar.gz | docker load
            
            # Copy docker-compose.prod.yml to docker-compose.yml
            cp docker-compose.prod.yml docker-compose.yml
            
            # Stop old containers
            docker-compose down
            
            # Start new containers
            docker-compose up -d
            
            # Cleanup
            rm images.tar.gz
            
            echo "✅ Deployment complete!"
