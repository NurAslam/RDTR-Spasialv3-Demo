name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy.yml"
      - "ecosystem.config.cjs"
  workflow_dispatch: # Enable manual trigger

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps/backend/,ecosystem.config.cjs"
          target: "/home/ml/be-rdtr-di"
          rm: true

      - name: Deploy on VPS with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Set PATH to include local bin
            export PATH="$HOME/.local/bin:$PATH"

            cd /home/ml/be-rdtr-di

            # Move contents of apps/backend/ to root (folder structure adjustment)
            if [ -d "apps/backend" ]; then
              mv apps/backend/* . && mv apps/backend/.* . 2>/dev/null || true
              rm -rf apps/backend
            fi

            # Create logs directory
            mkdir -p logs

            # Install dependencies (requirements.txt is in root now)
            python3 -m pip install -r requirements.txt -q

            # Install PM2 if not exists
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Stop old process
            pm2 stop 4004-be-rdtr-di 2>/dev/null || true
            pm2 delete 4004-be-rdtr-di 2>/dev/null || true

            # Start with PM2
            pm2 start ecosystem.config.cjs

            # Save PM2 process list
            pm2 save

            # Show status
            pm2 status

            echo "✅ Backend deployed successfully!"
            echo "Backend URL: http://${{ secrets.VPS_HOST }}:4004"
