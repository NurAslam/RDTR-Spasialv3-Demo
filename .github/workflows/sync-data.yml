name: Sync Data to VPS

on:
  push:
    paths:
      - 'packages/output/**'
    branches:
      - main
      - master
  workflow_dispatch:  # Enable manual trigger

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy output data to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "packages/output/"
          target: "/home/ml/be-rdtr-di/packages/"
          rm: true

      - name: Restart Backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Restart backend with PM2 to load new data
            pm2 restart 4004-be-rdtr-di
            pm2 logs 4004-be-rdtr-di --lines 20 --nostream
            echo "✅ Data synced and backend restarted!"
