name: Sync Data to VPS

on:
  push:
    paths:
      - 'packages/output/**'
    branches:
      - main
      - master
  workflow_dispatch:  # Enable manual trigger

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy output data to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "packages/output/"
          target: "/home/ml/rdtr-spasial/"
          rm: true

      - name: Restart Backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Restart backend to load new data
            pkill -f "uvicorn app.main:app" && sleep 2
            cd /home/ml/rdtr-spasial
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >> /home/ml/rdtr-spasial/app.log 2>&1 &
            echo "✅ Data synced and backend restarted!"
